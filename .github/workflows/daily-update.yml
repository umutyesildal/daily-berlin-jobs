name: Daily Berlin Jobs Update

on:
  workflow_dispatch:
    inputs:
      linkedin_posted_within_hours:
        description: LinkedIn job posting age window in hours
        type: string
        required: false
        default: "24"
  schedule:
    - cron: "17 8 * * *"

concurrency:
  group: daily-berlin-jobs-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Crawl, publish, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      STORAGE_BACKEND: postgres
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install application package
        run: python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Validate configuration
        run: |
          test -n "$DATABASE_URL"
          python -c 'import os; assert os.environ["DATABASE_URL"].startswith(("postgres://", "postgresql://"))'

      - name: Apply database migrations
        run: python scripts/db.py migrate

      - name: Check for a recent successful crawl
        id: freshness
        if: github.event_name == 'schedule'
        run: |
          skip=$(python - <<'PY'
          from daily_jobs.postgres_storage import PostgresJobStorage

          with PostgresJobStorage().connect() as connection, connection.cursor() as cursor:
              cursor.execute(
                  "SELECT EXISTS (SELECT 1 FROM crawl_runs "
                  "WHERE status = 'succeeded' AND finished_at > now() - interval '12 hours')"
              )
              print(str(cursor.fetchone()[0]).lower())
          PY
          )
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Sync company catalog
        if: steps.freshness.outputs.skip != 'true'
        run: python scripts/db.py import-companies catalog/companies.yaml --input-type yaml --skip-existing-boards

      - name: Collect ATS jobs
        if: steps.freshness.outputs.skip != 'true'
        run: |
          python -m daily_jobs.main \
            -t postgres

      - name: Publish canonical datasets
        if: steps.freshness.outputs.skip != 'true'
        env:
          LINKEDIN_POSTED_WITHIN_HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.linkedin_posted_within_hours || '24' }}
        run: |
          hours="$LINKEDIN_POSTED_WITHIN_HOURS"
          if ! [[ "$hours" =~ ^[0-9]+$ ]]; then
            echo "linkedin_posted_within_hours must be an integer between 1 and 720" >&2
            exit 1
          fi
          hours=$((10#$hours))
          if (( hours < 1 || hours > 720 )); then
            echo "linkedin_posted_within_hours must be an integer between 1 and 720" >&2
            exit 1
          fi
          posted_within_seconds=$((hours * 3600))
          python -m daily_jobs.post_process_jobs \
            --storage-backend postgres \
            --retention-days 30 \
            --include-linkedin-daily \
            --linkedin-raw-daily \
            --linkedin-posted-within-seconds "$posted_within_seconds" \
            --no-update-baseline

      - name: Verify PostgreSQL snapshot
        if: steps.freshness.outputs.skip != 'true'
        run: |
          python - <<'PY'
          from daily_jobs.postgres_storage import PostgresJobStorage

          with PostgresJobStorage().connect() as connection, connection.cursor() as cursor:
              cursor.execute("SELECT count(*) FROM public_jobs")
              all_count = cursor.fetchone()[0]
              cursor.execute("SELECT count(*) FROM daily_jobs")
              daily_count = cursor.fetchone()[0]
              cursor.execute("SELECT count(*) FROM public_jobs WHERE role = '' OR classification_version <> 'engineering-v2'")
              invalid_count = cursor.fetchone()[0]
          assert all_count > 0, "public_jobs is empty after publish"
          assert invalid_count == 0, "public_jobs contains invalid classification"
          print(f"Verified public_jobs: {all_count}")
          print(f"Verified daily_jobs: {daily_count}")
          PY
